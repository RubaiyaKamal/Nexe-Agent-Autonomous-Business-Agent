services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: nexe_agent
      POSTGRES_USER: nexe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexe_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexe -d nexe_agent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://nexe:${POSTGRES_PASSWORD:-nexe_dev}@postgres:5432/nexe_agent
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      TASK_TIMEOUT_SECONDS: ${TASK_TIMEOUT_SECONDS:-60}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-90}
      AUTO_EXECUTE_DEFAULT: ${AUTO_EXECUTE_DEFAULT:-false}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://nexe:${POSTGRES_PASSWORD:-nexe_dev}@postgres:5432/nexe_agent
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      TASK_TIMEOUT_SECONDS: ${TASK_TIMEOUT_SECONDS:-60}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-90}
      AUTO_EXECUTE_DEFAULT: ${AUTO_EXECUTE_DEFAULT:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A app.worker worker --loglevel=info

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_GRAPHQL_URL: ${NEXT_PUBLIC_GRAPHQL_URL:-http://localhost:8000/graphql}
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

volumes:
  postgres_data:
